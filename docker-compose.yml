services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: epub_user
      POSTGRES_PASSWORD: epub_pass
      POSTGRES_DB: epub_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  backend:
    # Имя образа в GitHub Container Registry (исправлено на epub-ai)
    image: ghcr.io/zaleshchikov/epub-ai:latest
    
    environment:
      - DB_USER=epub_user
      - DB_PASSWORD=epub_pass
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=epub_ai
      # host.docker.internal указывает на сам VPS, где крутится Ollama
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:14b}
      - LLM_API_KEY=ollama
      
    ports:
      - "8000:8000"
      
    depends_on:
      - db
      
    restart: always
    
    # Магия Docker: позволяет контейнеру обращаться к localhost хост-машины
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
