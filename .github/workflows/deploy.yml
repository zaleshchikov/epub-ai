name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Автоматически возьмет "zaleshchikov/epub-ai" из названия вашего репозитория
  IMAGE_NAME: ${{ github.repository }} 

jobs:
  # ==========================================
  # ЭТАП 1: CI (Сборка и проверка)
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Разрешение на запись в GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Если добавите тесты, раскомментируйте:
          # pip install pytest pytest-asyncio
          # pytest tests/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # ЭТАП 2: CD (Деплой на VPS)
  # ==========================================
  deploy:
    needs: build-and-test # Запускается ТОЛЬКО если сборка успешна
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Начало деплоя на VPS..."
            
            # 1. Логинимся в GHCR на сервере, чтобы скачать приватный образ
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Переходим в папку проекта (имя папки epub-ai)
            cd ~/epub-ai
            
            # 3. Скачиваем НОВЫЙ готовый образ (быстро, без сборки на VPS!)
            docker compose pull backend
            
            # 4. Перезапускаем только backend с новым образом
            docker compose up -d backend
            
            # 5. Чистим старые неиспользуемые образы, чтобы не забивать диск VPS
            docker image prune -f
            
            echo "✅ Деплой успешно завершен!"
